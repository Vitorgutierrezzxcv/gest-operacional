<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gest Operacional</title>
  <style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f6f6f6;color:#121415}.loading{min-height:100vh;display:grid;place-items:center}.loading div{text-align:center}.loading b{display:block;font-size:20px;margin-bottom:8px}.loading span{font-size:13px;color:#676c74}</style>
</head>
<body>
<div class="loading"><div><b>Carregando Gest Operacional…</b><span>Central Botanika / VermeFree</span></div></div>
<script>
(async()=>{
  try{
    const files=['part-0.txt','part-1.txt','part-2.txt','part-3.txt','part-4.txt','part-5.txt','part-6.txt'];
    const chunks=[];
    for(const file of files){
      const r=await fetch('/app/'+file,{cache:'no-store'});
      if(!r.ok) throw new Error(file+' retornou HTTP '+r.status);
      chunks.push(await r.text());
    }
    const html=chunks.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div style="padding:40px;font-family:Arial,sans-serif"><h2>Não foi possível carregar a Central</h2><pre style="white-space:pre-wrap">'+String(error)+'</pre></div>';
  }
})();
</script>
</body>
</html>
